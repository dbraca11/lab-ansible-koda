---
DOCUMENTATION:
  name: regex
  author: Ansible Core
  short_description: Does string match regular expression from the start
  description:
    - Compare string against regular expression using Python's match, fullmatch or search functions.
  options:
    _input:
      description: String to match.
      type: string
      required: true
    pattern:
      description: Regex to match against.
      type: string
      required: true
    ignorecase:
      description: Use case insensitive matching.
      type: boolean
      default: false
    multiline:
      description: Match against multiple lines in string.
      type: boolean
      default: false
    match_type:
      description:
        - Decide which function to be used to do the matching.
      type: string
      choices: [match, search, fullmatch]
      default: search

EXAMPLES: |
  - name: check if string matches regex
    assert:
      that:
        - 'url is regex("example\.com/\w+/foo")'
    vars:
      url: "https://example.com/users/foo/resources/bar"

  - name: check if string matches regex ignoring case
    assert:
      that:
        - 'url is regex("EXAMPLE\.COM/\w+/foo", ignorecase=True)'
    vars:
      url: "https://Example.com/users/foo/resources/bar"

RETURN:
  _value:
    description: Returns V(True) if there is a match, V(False) otherwise.
    type: boolean
