---
- name: Desplegar y configurar Nginx en los nodos del clúster
  hosts: all
  become: yes
  tasks:
    - name: Instalar Nginx con reintentos por bloqueos de apt
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes
      register: result
      until: result is succeeded
      retries: 5
      delay: 10

    - name: Asegurar que el servicio Nginx esté activo y habilitado
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Desplegar página web personalizada con el nombre del nodo
      ansible.builtin.copy:
        content: "<h1>Bienvenido a {{ inventory_hostname }} - Automatizado con Ansible</h1>\n"
        dest: /var/www/html/index.html
      notify: Reiniciar Nginx

  handlers:
    - name: Reiniciar Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
